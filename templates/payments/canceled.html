{% extends "base.html" %}

{% block title %}Payment Canceled | E-Store{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="mb-4">
            <i class="fas fa-times-circle text-danger" style="font-size: 6rem;"></i>
        </div>
        <h2 class="fw-bold mb-3">Payment Canceled</h2>
        <p class="text-secondary fs-5 mb-5">Your payment was not completed. If this was a mistake, you can try again from your cart.</p>
        
        <div class="d-flex justify-content-center gap-3">
            <a href="{% url 'cart:cart_detail' %}" class="btn btn-primary px-4 py-3 rounded-pill fw-bold">Return to Cart</a>
            <a href="{% url 'products:product_list' %}" class="btn btn-white border px-4 py-3 rounded-pill fw-bold">Back to Store</a>
        </div>
    </div>
</div>
{% endblock %}
