{% extends "base.html" %}

{% block title %}Payment Success | E-Store{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="mb-4">
            <i class="fas fa-check-circle text-success" style="font-size: 6rem;"></i>
        </div>
        <h2 class="fw-bold mb-3">Order Placed Successfully!</h2>
        <p class="text-secondary fs-5 mb-5">Thank you for your purchase. We've sent a confirmation email with your order details.</p>
        
        <div class="d-flex justify-content-center gap-3">
            <a href="{% url 'orders:order_history' %}" class="btn btn-primary px-4 py-3 rounded-pill fw-bold">View My Orders</a>
            <a href="{% url 'products:product_list' %}" class="btn btn-white border px-4 py-3 rounded-pill fw-bold">Continue Shopping</a>
        </div>
    </div>
</div>
{% endblock %}
