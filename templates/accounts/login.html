{% extends "base.html" %}

{% block title %}Login | E-Store{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5">
        <div class="card border-0 shadow-lg p-4 p-md-5 rounded-4">
            <div class="text-center mb-5">
                <h2 class="fw-bold">Welcome Back</h2>
                <p class="text-secondary">Please enter your details to sign in</p>
            </div>
            <form method="post">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="form-label fw-bold">Username</label>
                    <input type="text" name="username" class="form-control py-2 rounded-3" placeholder="Enter your username" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Password</label>
                    <input type="password" name="password" class="form-control py-2 rounded-3" placeholder="••••••••" required>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="remember">
                        <label class="form-check-label small" for="remember">Remember me</label>
                    </div>
                    <a href="#" class="small text-decoration-none">Forgot password?</a>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-3 rounded-3 fw-bold mb-4">Sign In</button>
                
                <div class="text-center">
                    <p class="small text-secondary">Don't have an account? <a href="{% url 'accounts:register' %}" class="fw-bold text-decoration-none">Sign Up</a></p>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
