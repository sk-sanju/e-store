{% extends "base.html" %}

{% block title %}Add Balance | E-Store{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5">
        <div class="card border-0 shadow-lg p-4 p-md-5 rounded-4">
            <div class="text-center mb-5">
                <div class="mb-3">
                    <i class="fas fa-wallet text-primary" style="font-size: 3rem;"></i>
                </div>
                <h2 class="fw-bold">Add Balance</h2>
                <p class="text-secondary">Current Balance: <span class="fw-bold text-dark">${{ user.balance }}</span></p>
            </div>
            <form method="post">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="form-label fw-bold">Amount to Add</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0">$</span>
                        <input type="number" name="amount" class="form-control border-start-0 py-2 rounded-end-3" placeholder="0.00" step="0.01" min="1" required>
                    </div>
                </div>
                
                <div class="row g-2 mb-4">
                    <div class="col-4">
                        <button type="button" class="btn btn-outline-secondary w-100 py-2" onclick="document.querySelector('input[name=amount]').value=10">$10</button>
                    </div>
                    <div class="col-4">
                        <button type="button" class="btn btn-outline-secondary w-100 py-2" onclick="document.querySelector('input[name=amount]').value=50">$50</button>
                    </div>
                    <div class="col-4">
                        <button type="button" class="btn btn-outline-secondary w-100 py-2" onclick="document.querySelector('input[name=amount]').value=100">$100</button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-3 rounded-3 fw-bold mb-4">
                    Confirm & Add
                </button>
                
                <div class="text-center">
                    <a href="{% url 'accounts:profile' %}" class="small text-secondary text-decoration-none"><i class="fas fa-arrow-left me-1"></i> Back to Profile</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
